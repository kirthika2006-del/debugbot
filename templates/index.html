<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DebugBot</title>
<style>
    :root {
        --bg: #10131a;
        --panel: #161b24;
        --gutter: #0d1016;
        --border: #262e3d;
        --text: #d7dce2;
        --dim: #6b7688;
        --accent-cyan: #5fd8c9;
        --accent-amber: #e0b96e;
        --accent-red: #ff6b6b;
        --accent-blue: #6fa8ff;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'SF Mono', monospace;
        background: var(--bg);
        background-image:
            radial-gradient(circle at 20% 0%, rgba(95, 216, 201, 0.06), transparent 40%),
            radial-gradient(circle at 80% 100%, rgba(111, 168, 255, 0.06), transparent 40%);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .ide {
        width: 460px;
        max-width: 92vw;
        height: 640px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }

    .tab-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--gutter);
        border-bottom: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red { background: var(--accent-red); }
    .dot.amber { background: var(--accent-amber); }
    .dot.green { background: var(--accent-cyan); }

    .tab-title {
        margin-left: 8px;
        font-size: 13px;
        color: var(--dim);
    }

    .tab-title .cursor {
        display: inline-block;
        width: 7px;
        height: 13px;
        background: var(--accent-cyan);
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .console {
        flex: 1;
        overflow-y: auto;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
    }

    .console::-webkit-scrollbar { width: 8px; }
    .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .line {
        display: flex;
        padding: 6px 14px;
        opacity: 0;
        transform: translateY(6px);
        animation: rise 0.28s ease forwards;
    }

    @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
    }

    .gutter {
        width: 32px;
        flex-shrink: 0;
        color: #3a4353;
        font-size: 12px;
        user-select: none;
        text-align: right;
        padding-right: 10px;
    }

    .tag {
        flex-shrink: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 1px 6px;
        border-radius: 4px;
        margin-right: 10px;
        height: fit-content;
    }

    .tag.you { background: rgba(111, 168, 255, 0.15); color: var(--accent-blue); }
    .tag.bot { background: rgba(95, 216, 201, 0.15); color: var(--accent-cyan); }

    .content {
        font-size: 13.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .content code, .content pre {
        display: block;
        background: var(--gutter);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 6px;
        color: var(--accent-amber);
        overflow-x: auto;
    }

    .typing {
        display: flex;
        gap: 4px;
        padding: 4px 0;
    }

    .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-cyan);
        animation: pulse 1.1s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
        0%, 60%, 100% { opacity: 0.25; transform: scale(0.8); }
        30% { opacity: 1; transform: scale(1.1); }
    }

    .input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        background: var(--gutter);
    }

    .prompt-symbol {
        color: var(--accent-cyan);
        font-weight: 700;
        flex-shrink: 0;
    }

    input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 13.5px;
    }

    input::placeholder { color: var(--dim); }

    button {
        border: 1px solid var(--accent-cyan);
        background: transparent;
        color: var(--accent-cyan);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
        background: var(--accent-cyan);
        color: #0d1016;
        box-shadow: 0 0 14px rgba(95, 216, 201, 0.5);
    }

    .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 14px;
        background: #0f2a26;
        color: #8fe0d1;
        font-size: 11px;
        border-top: 1px solid var(--border);
    }

    .status-bar .live {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .status-bar .live::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent-cyan);
        box-shadow: 0 0 8px var(--accent-cyan);
        animation: pulse-dot 1.6s ease-in-out infinite;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
</style>
</head>
<body>

<div class="ide">
    <div class="tab-bar">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="tab-title">debug_session.py<span class="cursor"></span></span>
    </div>

    <div class="console" id="console">
        <div class="line" style="animation-delay: 0s;">
            <span class="gutter">1</span>
            <span class="tag bot">BOT</span>
            <span class="content">Paste your code or error message. I'll trace the bug and hand you the fix.</span>
        </div>
    </div>

    <div class="input-row">
        <span class="prompt-symbol">&gt;</span>
        <input type="text" id="userInput" placeholder="paste error / code here...">
        <button onclick="sendMessage()">Run</button>
    </div>

    <div class="status-bar">
        <span class="live">connected</span>
        <span>gemini-3.1-flash-lite</span>
    </div>
</div>

<script>
    const consoleBox = document.getElementById("console");
    const userInput = document.getElementById("userInput");
    let lineCount = 1;

    userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    function formatContent(text) {
        const escaped = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        return escaped.replace(/```([\s\S]*?)```/g, "<code>$1</code>");
    }

    function addLine(text, sender) {
        lineCount++;
        const line = document.createElement("div");
        line.classList.add("line");

        const gutter = document.createElement("span");
        gutter.classList.add("gutter");
        gutter.textContent = lineCount;

        const tag = document.createElement("span");
        tag.classList.add("tag", sender === "user" ? "you" : "bot");
        tag.textContent = sender === "user" ? "YOU" : "BOT";

        const content = document.createElement("span");
        content.classList.add("content");
        content.innerHTML = formatContent(text);

        line.appendChild(gutter);
        line.appendChild(tag);
        line.appendChild(content);
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
        return line;
    }

    function showTyping() {
        lineCount++;
        const line = document.createElement("div");
        line.classList.add("line");
        line.id = "typing-line";

        const gutter = document.createElement("span");
        gutter.classList.add("gutter");
        gutter.textContent = lineCount;

        const tag = document.createElement("span");
        tag.classList.add("tag", "bot");
        tag.textContent = "BOT";

        const typing = document.createElement("span");
        typing.classList.add("typing");
        typing.innerHTML = "<span></span><span></span><span></span>";

        line.appendChild(gutter);
        line.appendChild(tag);
        line.appendChild(typing);
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function removeTyping() {
        const line = document.getElementById("typing-line");
        if (line) {
            line.remove();
            lineCount--;
        }
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        addLine(message, "user");
        userInput.value = "";
        showTyping();

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            removeTyping();
            addLine(data.reply, "bot");
        } catch (error) {
            removeTyping();
            addLine("Connection lost. Try running that again.", "bot");
        }
    }
</script>

</body>
</html>
